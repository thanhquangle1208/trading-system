# Phase 5 — backtest
initial_balance_usdt: 1000
warmup_bars: 100          # đủ cho EMA 89 / MACD
fee_bps: 10               # 0.10% mỗi phía (vào/ra)
slippage_bps: 5           # 0.05% trượt giá giả lập
funding_bps_per_bar: 0    # Spot = 0; perp sau có thể > 0

# Nến thật
data:
  mode: real              # real | mock
  prefer_exchange: bybit  # thử Bybit trước; nếu bị chặn geo → OKX/Gate…
  symbol: BTC/USDT
  timeframe: H1
  bars: 500

# Walk-forward
walk_forward:
  train_ratio: 0.7

# Optuna (tối ưu nhẹ)
optuna:
  n_trials: 8
  score_threshold_min: 50
  score_threshold_max: 80
