[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.2.0"
description = "Personal trading system — buy-zone alerts from Notion to Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tzdata>=2024.1",
  "certifi>=2024.0",
  "truststore>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." so `import tests...` works when CI runs the pytest script (not python -m).
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
